version: 2
updates:
  # Автообновление версий Actions-расширений
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # NuGet-зависимости C#-решения (WindowsAppSDK, xUnit, ...)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
  # Слежение за pip-зависимостями legacy-ветки (Python-эра закрыта, точка контроля на будущее)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
