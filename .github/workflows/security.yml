name: security
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # SAST: подозрительные элементы в коде (shell, сеть, subprocess)
  bandit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit
      - run: bandit -r . -q --skip B101 --exclude .github,.opencode,tools,temp,logs,build,dist,__pycache__,_baseline

  # Мёртвый код: неиспользуемые функции и классы
  vulture:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install vulture
      - run: vulture main.py engine.py --min-confidence 80
