name: tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  dotnet-test:
    # Раннер Windows: WinUI3-проект (Windows App SDK) собирается только там.
    if: ${{ hashFiles('**/*.sln') != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore VideoBoost.sln /p:Platform=x64
      - name: Build (0 warnings — правило агентов)
        run: dotnet build VideoBoost.sln -c Release --no-restore
      - name: Test (xUnit)
        run: dotnet test VideoBoost.sln -c Release --no-build --verbosity normal
