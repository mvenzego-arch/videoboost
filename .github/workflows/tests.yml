name: tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Verify tkinter present (GUI suite)
        id: tkcheck
        continue-on-error: true
        run: python -c "import tkinter"
      - name: Run test suite
        if: steps.tkcheck.outcome == 'success'
        run: |
          if [ ! -d tests ] || [ -z "$(ls -A tests 2>/dev/null)" ]; then
            echo "::notice::Тестов пока нет — qa-runner их напишет"
            exit 0
          fi
          python -m unittest discover tests -v
      - name: Skip notice (no tkinter on runner)
        if: steps.tkcheck.outcome != 'success'
        run: echo "::notice::tkinter недоступен на раннере — GUI-тесты выполняются на машине разработки"
