name: tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run test suite
        run: |
          if [ ! -d tests ] || [ -z "$(ls -A tests 2>/dev/null)" ]; then
            echo "::notice::Тестов пока нет — qa-runner их напишет"
            exit 0
          fi
          python -m unittest discover tests -v
