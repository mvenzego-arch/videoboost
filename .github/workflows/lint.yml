name: lint
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Опечатки в строках и комментариях (критично при русском тексте UI)
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install typos
        uses: taiki-e/install-action@v2
        with:
          tool: typos
      - name: Check typos
        run: typos --format long .
