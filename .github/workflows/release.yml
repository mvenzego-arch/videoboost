name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # Только C#-эра: на ветке legacy-python csproj нет — режим наблюдения
    if: ${{ hashFiles('src/**/*.csproj') != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish (self-contained, без зависимостей у пользователя)
        run: >
          dotnet publish src/VideoBoost.App/VideoBoost.App.csproj
          -c Release -r win-x64 /p:Platform=x64 --self-contained true
          /p:WindowsAppSDKSelfContained=true -o publish/
      - name: Package
        run: Compress-Archive -Path publish/* -DestinationPath VideoBoost-win-x64.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoBoost-win-x64
          path: VideoBoost-win-x64.zip
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VideoBoost-win-x64.zip
          generate_release_notes: true
